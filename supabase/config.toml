# Ilm o Irfan — local Supabase config
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "ilm-o-irfan"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the hosted project (Postgres 17.6). Local must mirror production or it
# stops being a rehearsal for it.
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# The app subscribes to a private per-reader topic (entitlement:<user_id>) to
# be told the moment a subscription ends. Off locally meant that path could
# only ever be tested against production.
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "ilmoirfan://**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
# Lets a signed-in user link Google via auth.linkIdentity / linkIdentityWithIdToken.
# Same-email Google ↔ email/password is automatic when the email is verified.
enable_manual_linking = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local Inbucket: confirmations off for DX. Hosted staging keeps confirmations On
# so automatic Google↔email linking stays safe (unverified emails are not linked).
enable_confirmations = false

[auth.external.google]
# Set GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET in the environment, then flip enabled.
# Prefer the Web client ID first (required for native Android ID-token exchange).
# Multiple clients: "WEB_CLIENT_ID,ANDROID_CLIENT_ID,IOS_CLIENT_ID"
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
# Native RN Google Sign-In often cannot pass Supabase's nonce; enable Skip nonce
# check in Dashboard / hosted config when using @react-native-google-signin.
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.get-signed-pdf]
verify_jwt = true

[functions.vault-check]
verify_jwt = true

# Deprecated alias. Left open so callers receive the 410 body rather than a
# gateway 401 that tells them nothing.
[functions.signed-pdf]
verify_jwt = false

[functions.revenuecat-webhook]
verify_jwt = false

# Server-to-server: the database kicks it through pg_net with a shared secret
# (x-push-secret). No user JWT is ever involved.
[functions.push-dispatch]
verify_jwt = false

# Executes approved account deletions. Called by pg_cron via pg_net with
# x-ops-secret, or by an admin (JWT checked inside; verify_jwt stays off
# so the database path can reach it).
[functions.account-deletion-run]
verify_jwt = false

