name: Backend static checks

on:
  push:
    branches: [main, dev, 'feat/**']
  pull_request:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Folders <-> config.toml <-> manifest, method contracts, fixture
      # envelopes, migration ordering, and a secret scan. No Docker, no Deno.
      - name: Static contract checks
        run: npm run ci:static

  deno:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The Edge Functions import supabase-js from esm.sh, so the first run has
      # to reach the network; the cache keeps later runs offline-fast.
      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Typecheck every function
        run: deno check supabase/functions/_shared/*.ts supabase/functions/*/index.ts

      - name: Lint
        run: deno lint

      - name: Unit tests
        run: deno test --allow-env --allow-net=esm.sh,jsr.io,deno.land tests/

  # Full e2e needs Docker plus `supabase start`, which this runner does not
  # provide. Run `npm run test:e2e` locally against a started stack, or against
  # staging using the checklist in docs/ops/deploy-checklist.md.
  e2e-note:
    name: E2E (manual)
    runs-on: ubuntu-latest
    steps:
      - run: echo "npm run test:e2e requires Docker + supabase start; run it locally or on staging."
