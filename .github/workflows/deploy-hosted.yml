name: Deploy hosted (staging)

# Manual only — never on push. Wire GitHub Actions secrets first (see docs/ops/env-matrix.md).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
        default: staging
      seed:
        description: Apply supabase/seed.sql after db push
        required: true
        type: boolean
        default: true
      allow_placeholder_rc:
        description: Allow staging placeholder RevenueCat webhook auth
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-hosted-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
          REVENUECAT_WEBHOOK_AUTH: ${{ secrets.REVENUECAT_WEBHOOK_AUTH }}
          REVENUECAT_ENTITLEMENT_ID: ${{ secrets.REVENUECAT_ENTITLEMENT_ID }}
          SIGNED_PDF_EXPIRES_IN: ${{ secrets.SIGNED_PDF_EXPIRES_IN }}
          DEPLOY_SEED: ${{ github.event.inputs.seed == 'true' && '1' || '0' }}
          DEPLOY_ALLOW_PLACEHOLDER_RC: ${{ github.event.inputs.allow_placeholder_rc == 'true' && '1' || '0' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF_STAGING"
            exit 1
          fi
          npm run deploy:hosted
